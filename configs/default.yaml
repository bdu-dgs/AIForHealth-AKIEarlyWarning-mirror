  chart:                                 # CHARTEVENTS numeric concepts: itemids, unit conversion, valid range
    heart_rate:  {itemids: [211, 220045], range: [0, 300]}
    sbp:         {itemids: [51, 442, 455, 6701, 220179, 220050, 225309, 224167, 227243], range: [0, 400]}
    dbp:         {itemids: [8368, 8440, 8441, 8555, 220180, 220051, 225310, 224643, 227242], range: [0, 300]}
    mbp:         {itemids: [456, 52, 6702, 443, 220052, 220181, 225312], range: [0, 300]}
