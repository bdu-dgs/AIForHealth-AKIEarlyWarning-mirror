# Study configuration for pipeline/01_dataset_construction.ipynb.
# Every cohort, label, feature, coverage, and split choice lives here. Changing any study choice
# requires a new dataset.version; notebooks record the SHA-256 of this file with every artifact.

dataset:
  version: "aki_hourly_v1.0"
  source: "MIMIC-III Clinical Database v1.4"

paths:                                   # relative paths are resolved from the repository root
  mimic_root: "../mimiciii/1.4"          # local, approved MIMIC-III CSV directory
  output_root: "../Cleaned"              # analysis-ready outputs consumed by notebook 02
  interim_root: "artifacts/interim"      # filtered source caches (local only, never commit)

processing:
  csv_block_mb: 64                       # streaming block size for large CSV tables
  stay_partition_size: 4000              # ICU stays per feature-building partition (memory bound)
  reuse_interim_cache: true              # reuse filtered Parquet caches when they cover the request

cohort:
  selection_rule_version: "earliest_adult_icu_stay_v1"   # earliest INTIME, tie-break ICUSTAY_ID
  min_age_years: 18
  shifted_age_threshold_years: 150       # MIMIC shifts ages > 89 to about 300 years
  shifted_age_value_years: 91.4          # median true age of the shifted group (MIMIC documentation)
  min_followup_hours: 7                  # first snapshot (1 h) + shortest horizon (6 h), from min(OUTTIME, DEATHTIME)
  exclude_no_chartevents: true           # ADMISSIONS.HAS_CHARTEVENTS_DATA == 0
  eskd_pre_icu_creatinine_mg_dl: 4.0     # lowest creatinine in the 7 d before ICU >= this: presumed CKD 5 / ESKD
  # Chronic kidney failure / dialysis / transplant codes (exact match; index and prior admissions).
  eskd_icd9_diagnoses: ["5855", "5856", "V451", "V4511", "V4512", "V560", "V561", "V562", "V5631",
                        "V5632", "V568", "99656", "99668", "99673"]
  eskd_icd9_procedures: ["5498", "3927", "3942", "3943"]
  # Chronic hemodialysis proxy for CareVue-era coding: hemodialysis procedure + CKD/hypertensive-CKD
  # code + no acute kidney failure code on the index admission.
  chronic_hd_proxy: {procedure: "3995", ckd_prefixes: ["585", "403", "404"], acute_prefix: "584"}
  kidney_transplant_icd9_diagnoses: ["V420", "99681"]
  kidney_transplant_icd9_procedures: ["5569", "5561", "5553"]

monitoring:
  first_snapshot_hour: 1                 # snapshot_time = ICU INTIME + k hours
  last_snapshot_hour: 72                 # candidate monitoring period; notebook 03 locks the operational window
  snapshot_interval_hours: 1
  reporting_checkpoints_hours: [6, 12, 24, 48]

labels:
  horizons_hours: [6, 12, 24, 48]
  primary_target: "creatinine_kdigo"
  operational_horizon: "selected_on_validation"          # chosen in notebook 03, not here
  censoring_events: ["icu_discharge", "death", "rrt_start"]
  creatinine_kdigo:
    version: "kdigo2012_scr_v1"
    abs_rise_mg_dl: 0.3                  # increase >= 0.3 mg/dL over the lowest value in the prior 48 h
    abs_window_hours: 48
    rel_rise_ratio: 1.5                  # >= 1.5 x the lowest value in the prior 7 days
    rel_window_days: 7
    stage2_ratio: 2.0
    stage3_ratio: 3.0
    stage3_abs_mg_dl: 4.0
    onset_lookback_days: 7               # an onset in the 7 d before ICU admission = AKI already present
  baseline_creatinine:
    version: "baseline_v1"
    primary: "rolling_7d_min"            # at each measurement: lowest value in the prior 7 days (past only)
    history_window_days: [8, 365]        # historic (outpatient/earlier) median, used by an alternative
    mdrd_assumed_egfr: 75                # KDIGO-suggested back-calculation for a missing baseline
    alternatives: ["mdrd_if_missing", "min_with_history"]
  urine_output_kdigo:
    enabled: true
    version: "kdigo2012_uo_v1"
    standard: "KDIGO 2012 urine-output criteria (robustness endpoint only)"
    weight_source: "first ICU admission weight, else first daily weight, else MetaVision order weight"
    weight_window_hours: [-24, 24]       # relative to ICU INTIME
    stage1_rate_ml_kg_h: 0.5             # < 0.5 mL/kg/h for 6 h (stage 1) or 12 h (stage 2)
    stage3_rate_ml_kg_h: 0.3             # < 0.3 mL/kg/h for 24 h, or anuria for 12 h (stage 3)
    max_interval_hours: 6                # charted volume covers the interval since the previous charting;
                                         # longer intervals are undocumented, not zero output
    min_window_coverage: 1.0             # fraction of window hours that must be documented
    rrt_rule: "censor"                   # urine output is not assessed after RRT starts

coverage:                                # applied separately from horizon eligibility
  prior_creatinine_lookback_days: 7      # snapshot needs >= 1 creatinine in the prior 7 days (or earlier ICU)
  require_prior_heart_rate: true         # and >= 1 charted heart rate in the ICU at or before the snapshot
  drop_snapshots_failing_coverage: true  # failing snapshots are removed and counted, never labelled negative

features:
  vital_windows_hours: [6, 24]
  lab_lookback_days: 7                   # lab history (incl. pre-ICU) visible to "latest value" features
  lab_result_delay_hours: 1              # LABEVENTS time is the draw time; a result is usable 1 h later
                                         # (features and coverage only; KDIGO onsets stay at draw time)
  urine_windows_hours: [6, 12, 24]
  infusion_windows_hours: [2, 24]        # vasoactive infusion running within the past 2 h / 24 h
  bolus_windows_hours: [24]
  prescription_availability_delay_hours: 24   # PRESCRIPTIONS has dates only: usable from the end of the start day
  ventilation_window_hours: 8
  float_dtype: "float32"

split:
  version: "patient_split_v1"
  seed: 20260929
  proportions: {train: 0.70, validation: 0.15, test: 0.15}
  stratify_by: ["source_system"]         # CareVue / MetaVision / both; never outcome-based

# Source item mappings (verified against D_ITEMS / D_LABITEMS and the data; see notebook Part 3).
